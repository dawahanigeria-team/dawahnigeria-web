name: Build and Deploy to VPS

on:
  push:
    branches:
      - yusuf/hosting-ssr
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for Sentry commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Use Yarn 1.x via Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn -v

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build React client
        env:
          NODE_ENV: production
          CI: false
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_API_ADMINISTER_BASE_URL: ${{ secrets.REACT_APP_API_ADMINISTER_BASE_URL }}
          # Sentry client env
          REACT_APP_SENTRY_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          REACT_APP_SENTRY_ENVIRONMENT: production
          REACT_APP_SENTRY_RELEASE: ${{ github.sha }}
          REACT_APP_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          REACT_APP_SENTRY_PROFILES_SAMPLE_RATE: "0"
        run: |
          yarn build
          # Copy static assets imported at runtime by SSR
          mkdir -p build/assets
          cp -R src/assets/* build/assets/ || true
          echo "Build completed successfully"

      - name: Create Sentry release and upload sourcemaps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
          sourcemaps: ./build
          url_prefix: "~/"
          finalize: true
          inject: true
          ignore_missing: true

      - name: Create artifact (build.tar.gz)
        run: tar -czf build.tar.gz -C build .

      - name: Prepare release dir on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euxo pipefail
            APP_DIR="/var/www/dawahnig-live"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            mkdir -p "$APP_DIR" "$RELEASE_DIR"

      - name: Upload build archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: build.tar.gz
          target: /var/www/dawahnig-live/releases/${{ github.sha }}/

      - name: Activate release and reload PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euxo pipefail
            APP_DIR="/var/www/dawahnig-live"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            mkdir -p "$APP_DIR" "$RELEASE_DIR/build"
            # Ensure github.com is trusted for server-side git operations
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            ssh-keyscan -H github.com >> /root/.ssh/known_hosts || true
            chmod 600 /root/.ssh/known_hosts || true
            # Ensure server code exists and is on the correct branch
            if [ ! -d "$APP_DIR/.git" ]; then
              GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes" git clone --branch master --depth 1 git@github.com:dawahanigeria-team/dawahnig-live.git "$APP_DIR"
            else
              cd "$APP_DIR"
              GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes" git fetch origin master
              GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes" git reset --hard FETCH_HEAD
            fi
            cd "$APP_DIR"
            # Ensure runtime env for SSR
            cat > "$APP_DIR/.env" <<EOF
            NODE_ENV=production
            PORT=3000
            REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}
            REACT_APP_API_ADMINISTER_BASE_URL=${{ secrets.REACT_APP_API_ADMINISTER_BASE_URL }}
            # Sentry server env
            SENTRY_DSN=${{ secrets.SENTRY_BACKEND_DSN }}
            SENTRY_ENVIRONMENT=production
            SENTRY_TRACES_SAMPLE_RATE=0.1
            SENTRY_PROFILES_SAMPLE_RATE=0
            SENTRY_RELEASE=${{ github.sha }}
            EOF
            # Install server deps (safe to rerun; needed for Babel/runtime)
            if ! command -v yarn >/dev/null 2>&1; then
              corepack enable || true
              corepack prepare yarn@1.22.22 --activate || true
            fi
            yarn install --frozen-lockfile --production=false
            # Activate the new static build
            tar -xzf "$RELEASE_DIR/build.tar.gz" -C "$RELEASE_DIR" --strip-components=1
            rm -rf "$APP_DIR/build"
            ln -sfn "$RELEASE_DIR" "$APP_DIR/build"
            # Stop any existing PM2 processes
            pm2 stop dawahnigeria-ssr || true
            pm2 delete dawahnigeria-ssr || true
            
            # Start or reload SSR via PM2
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2@5
            fi
            
            echo "Starting SSR server with PM2..."
            pm2 start "$APP_DIR/server/ssr.js" --name dawahnigeria-ssr --time --max-memory-restart 1G || {
              echo "Failed to start SSR server. Checking logs..."
              pm2 logs dawahnigeria-ssr --lines 50 || true
              exit 1
            }
            
            # Wait for server to start
            sleep 10
            
            # Verify the server is running and showing correct message
            if ! pm2 describe dawahnigeria-ssr >/dev/null 2>&1; then
              echo "SSR server failed to start"
              pm2 logs dawahnigeria-ssr --lines 50 || true
              exit 1
            fi
            
            # Check if it's the correct server by testing the health endpoint
            HEALTH_RESPONSE=$(curl -s http://127.0.0.1:3000/health || echo "FAILED")
            if [[ "$HEALTH_RESPONSE" == *"Full SSR Server with React 19 running"* ]]; then
              echo "✅ SSR server is running correctly"
            else
              echo "❌ Wrong server is running. Expected SSR server but got: $HEALTH_RESPONSE"
              pm2 logs dawahnigeria-ssr --lines 50 || true
              exit 1
            fi
            
            pm2 save
            pm2 startup systemd -u root --hp /root || true
            # Local health check
            curl -fsS http://127.0.0.1:3000/health || (pm2 logs --lines 100 dawahnigeria-ssr || true; exit 1)
