name: Bug report
description: Something on the site is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do **not** use this form
        for security vulnerabilities — see [SECURITY.md](../blob/dev/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /dawahcast/trending
        2. Tap the third row
        3. ...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://dawahnigeria.com/dawahcast/trending
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - Live site (dawahnigeria.com)
        - Local development server
        - Both
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android 14 / Safari on iPhone 15 / Firefox on Windows
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag images in here. Strongly encouraged for anything visual.
    validations:
      required: false
